spring:
  datasource:
    url: jdbc:h2:mem:skyscoffee_demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  sql:
    init:
      mode: never
  session:
    store-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  h2:
    console:
      enabled: false
server:
  address: 127.0.0.1
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    root: INFO
